  <text x="1082" y="86" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d1fae5">ABOUT   PROJECTS   JOURNEY   DONATE</text>

  <text x="600" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="#fff">Clean Water</text>
  <text x="600" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="#84cc16">Changes Everything</text>
  <text x="600" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e5e7eb">Providing access to clean water to underserved communities in East Africa,</text>
  <text x="600" y="387" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e5e7eb">transforming lives one drop at a time.</text>

  <rect x="420" y="426" width="160" height="48" rx="7" fill="#15803d"/>
  <text x="500" y="457" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">DONATE NOW →</text>
  <rect x="595" y="426" width="164" height="48" rx="7" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="677" y="457" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">▶  LEARN MORE</text>

  <line x1="170" y1="525" x2="1030" y2="525" stroke="#fff" stroke-opacity=".18"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="250" y="588" font-size="38" font-weight="800" fill="#84cc16">50,000+</text>
    <text x="250" y="620" font-size="15" fill="#d1d5db">People Served</text>
    <text x="480" y="588" font-size="38" font-weight="800" fill="#84cc16">120+</text>
    <text x="480" y="620" font-size="15" fill="#d1d5db">Wells Built</text>
    <text x="720" y="588" font-size="38" font-weight="800" fill="#84cc16">85%</text>
    <text x="720" y="620" font-size="15" fill="#d1d5db">Health Improvement</text>
    <text x="950" y="588" font-size="38" font-weight="800" fill="#84cc16">15+</text>
    <text x="950" y="620" font-size="15" fill="#d1d5db">Communities</text>
  </g>
  <rect x="510" y="676" width="180" height="26" rx="13" fill="#fff" opacity=".10"/>
  <text x="600" y="694" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#d1fae5">HOMEPAGE / IMPACT</text>
