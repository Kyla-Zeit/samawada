<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Samawada homepage portfolio preview</title>
  <desc id="desc">Source-faithful visualization of the Samawada clean water hero and impact statistics.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d24"/>
      <stop offset="0.55" stop-color="#155e3a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#84cc16" stop-opacity=".42"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <rect x="28" y="28" width="1144" height="704" rx="24" fill="url(#hero)"/>
  <circle cx="1010" cy="145" r="215" fill="#84cc16" opacity=".08"/>
  <circle cx="170" cy="650" r="245" fill="#22c55e" opacity=".10"/>
  <path d="M820 52 C930 180 1060 120 1150 245 L1150 390 C1030 285 900 340 780 215 Z" fill="url(#glow)" opacity=".75"/>

