  <text x="600" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#374151">Our Projects</text>
  <text x="600" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7280">Sustainable water solutions designed around the communities they serve.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="74" y="250" width="326" height="365" rx="14" fill="#fff" stroke="#e5e7eb"/>
