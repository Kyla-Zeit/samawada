<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Samawada projects portfolio preview</title>
  <desc id="desc">Source-faithful visualization of Samawada project cards for water initiatives in Somalia.</desc>
  <rect width="1200" height="760" fill="#f8faf9"/>
  <rect x="28" y="28" width="1144" height="704" rx="24" fill="#f0fdf4" stroke="#e5e7eb"/>
