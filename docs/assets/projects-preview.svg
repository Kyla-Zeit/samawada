    <text x="98" y="377" font-size="24" font-weight="800" fill="#374151">Initiative</text>
    <text x="98" y="419" font-size="14" fill="#6b7280">Sustainable water distribution points</text>
    <text x="98" y="442" font-size="14" fill="#6b7280">for urban communities.</text>
    <line x1="98" y1="474" x2="376" y2="474" stroke="#e5e7eb"/>
    <text x="98" y="514" font-size="14" fill="#374151">●  Mogadishu, Somalia</text>
    <text x="98" y="548" font-size="14" fill="#374151">◷  2024</text>
    <text x="98" y="582" font-size="14" fill="#374151">●  5,000 people</text>

    <rect x="437" y="250" width="326" height="365" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <rect x="461" y="278" width="92" height="26" rx="13" fill="#e0f2fe"/>
    <text x="507" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">COMPLETED</text>
    <text x="461" y="346" font-size="24" font-weight="800" fill="#374151">Rural Well</text>
    <text x="461" y="377" font-size="24" font-weight="800" fill="#374151">Construction</text>
    <text x="461" y="419" font-size="14" fill="#6b7280">Deep-water wells for remote</text>
    <text x="461" y="442" font-size="14" fill="#6b7280">rural communities.</text>
    <line x1="461" y1="474" x2="739" y2="474" stroke="#e5e7eb"/>
    <text x="461" y="514" font-size="14" fill="#374151">●  Gedo Region, Somalia</text>
    <text x="461" y="548" font-size="14" fill="#374151">◷  2024</text>
    <text x="461" y="582" font-size="14" fill="#374151">●  2,500 people</text>

    <rect x="800" y="250" width="326" height="365" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <rect x="824" y="278" width="92" height="26" rx="13" fill="#e0f2fe"/>
    <text x="870" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">COMPLETED</text>
    <text x="824" y="346" font-size="24" font-weight="800" fill="#374151">School Water</text>
    <text x="824" y="377" font-size="24" font-weight="800" fill="#374151">Program</text>
    <text x="824" y="419" font-size="14" fill="#6b7280">Water systems for schools, health,</text>
