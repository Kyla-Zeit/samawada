    <text x="736" y="278" font-size="15" font-weight="700">$25</text><text x="1080" y="278" text-anchor="end" font-size="13">1 person / 2 weeks</text>
    <line x1="736" y1="297" x2="1080" y2="297" stroke="#fff" stroke-opacity=".18"/>
    <text x="736" y="329" font-size="15" font-weight="700">$50</text><text x="1080" y="329" text-anchor="end" font-size="13">1 family / 1 month</text>
