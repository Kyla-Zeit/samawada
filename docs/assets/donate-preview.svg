  <text x="600" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#dcfce7">A donor-focused interaction connecting contribution amounts to visible impact.</text>

  <rect x="92" y="156" width="568" height="542" rx="18" fill="#fff"/>
