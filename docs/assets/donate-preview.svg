<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Samawada donation portfolio preview</title>
  <desc id="desc">Source-faithful visualization of the interactive Samawada donation experience.</desc>
  <rect width="1200" height="760" fill="#15803d"/>
